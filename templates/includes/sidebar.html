<aside class="sidebar" id="sidebar">
    <div class="sidebar-brand">
        <div class="brand-mark">
            <i class="fas fa-warehouse"></i>
        </div>
        <div class="brand-text">
            <div class="brand-name">AlmacenSys</div>
            <div class="brand-sub">Sistema de Gestión</div>
        </div>
    </div>

    <nav class="sidebar-nav">
        <div class="nav-label">Principal</div>
        <a href="{% url 'home' %}"
           class="nav-item {% if request.resolver_match.url_name == 'home' and not request.resolver_match.namespace %}active{% endif %}">
            <i class="fas fa-chart-line"></i>
            <span>Dashboard</span>
        </a>
        <a href="{% url 'inventory:nuevo' %}"
           class="nav-item {% if request.resolver_match.namespace == 'inventory' and request.resolver_match.url_name == 'nuevo' %}active{% endif %}">
            <i class="fas fa-exchange-alt"></i>
            <span>Nuevo Movimiento</span>
        </a>

        <div class="nav-label">Gestión</div>
        <a href="{% url 'products:products_list' %}"
           class="nav-item {% if request.resolver_match.namespace == 'products' %}active{% endif %}">
            <i class="fas fa-boxes"></i>
            <span>Productos</span>
            {% if alertas_count > 0 %}
            <span class="badge">{{ alertas_count }}</span>
            {% endif %}
        </a>
        <a href="{% url 'projects:projects_list' %}"
           class="nav-item {% if request.resolver_match.namespace == 'projects' %}active{% endif %}">
            <i class="fas fa-project-diagram"></i>
            <span>Proyectos</span>
        </a>
        <a href="{% url 'employees:employees_list' %}"
           class="nav-item {% if request.resolver_match.namespace == 'employees' %}active{% endif %}">
            <i class="fas fa-users"></i>
            <span>Empleados</span>
        </a>

        <div class="nav-label">Reportes</div>
        <a href="#" class="nav-item">
            <i class="fas fa-file-alt"></i>
            <span>Inventario</span>
        </a>
        <a href="#" class="nav-item">
            <i class="fas fa-file-invoice"></i>
            <span>Movimientos</span>
        </a>
    </nav>
</aside>
